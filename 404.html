<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Carona Solidária · Recife</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<script>
  // Este endereço virou parte do site único da Carona Solidária.
  // Leva junto, no "#" (que não sai do aparelho), o cadastro de motorista guardado aqui.
  (function () {
    var destino = 'https://caronasolidaria.github.io/?cidade=recife';
    var ir = (location.hash || '').slice(1);
    var dados = {};
    try {
      ['perfil', 'codigo', 'pedeCodigo'].forEach(function (k) {
        var v = localStorage.getItem('carona.' + k);
        if (v !== null) dados[k] = JSON.parse(v);
      });
    } catch (e) { /* sem storage */ }
    var hash = '';
    if (Object.keys(dados).length) {
      hash = '#migrar=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(dados))))) +
        (ir ? '&ir=' + encodeURIComponent(ir) : '');
    } else if (ir) {
      hash = '#' + ir;
    }
    location.replace(destino + hash);
  })();
</script>
<meta http-equiv="refresh" content="3;url=https://caronasolidaria.github.io/?cidade=recife">
<style>
  body { margin: 0; background: #f6f4ef; color: #1a1a1a; font: 20px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <p><strong>A Carona Solidária mudou de endereço.</strong></p>
  <p>Levando você para <a href="https://caronasolidaria.github.io/?cidade=recife">caronasolidaria.github.io</a>…</p>
</main>
</body>
</html>
